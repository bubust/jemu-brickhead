<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>積木磚頭｜找不到這一頁</title>
<script>
// Google 地圖（商家檔案）會把網址裡的「#」存成「%23」，例如 /jemu-brickhead/%23design → GitHub 找不到就到這頁。
// 看到 %23 就轉回正確的網址（/jemu-brickhead/#design）
(function () {
  var base = "/jemu-brickhead/";
  var p = location.pathname;
  var i = p.toLowerCase().indexOf("%23");
  if (i >= 0) {
    var hash = decodeURIComponent(p.slice(i + 3)).replace(/\/+$/, "");
    location.replace(base + (hash ? "#" + hash : ""));
  }
})();
</script>
<style>
:root{--accent:#b5925a;--bg:#f4f2ee;--dark:#1a1714}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--dark);
  font-family:'Noto Sans TC',system-ui,sans-serif;text-align:center;padding:0 16px}
h1{font-family:'Noto Serif TC',serif;font-weight:500;font-size:1.5rem;margin:0 0 .5rem}
p{margin:0 0 1.5rem;color:#5b544c}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:.75rem 1.5rem;border-radius:2px}
</style>
</head>
<body>
<main>
  <h1>找不到這一頁</h1>
  <p>網址可能打錯了，回首頁看看。</p>
  <a href="/jemu-brickhead/">回積木磚頭首頁</a>
</main>
</body>
</html>
